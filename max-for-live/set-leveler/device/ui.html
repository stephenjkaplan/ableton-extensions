<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set Leveler</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #2e3137; --panel: #363940; --ctl: #42454d; --ctl-hover: #4c5059; --input: #212328;
    --text: #fffcf9; --dim: #a9adb5; --border: #494d56; --accent: #f57825; --on-accent: #1a1209; --line: #3f424a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Avenir Next", "Avenir", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  h1 { font-size: 16px; margin: 0; flex: 1; }
  select, input { background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 4px 7px; font: 13px var(--sans); max-width: 240px; }
  input[type=number] { width: 66px; font-family: var(--mono); }
  button { background: var(--ctl); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 13px; font: 600 13px var(--sans); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--ctl-hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.link { background: none; border: 0; color: var(--dim); padding: 0; font-weight: 500; text-decoration: underline; }
  .block { padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .summary { font-size: 16px; }
  .sub { color: var(--dim); margin-top: 3px; }
  .target { display: flex; align-items: center; gap: 8px; }
  h2 { font-size: 14px; margin: 0 0 10px; }
  .q { padding: 10px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; padding-top: 0; }
  .q .name { font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .row .name { flex: 1; min-width: 0; font-size: 13px; }
  .chg { font-family: var(--mono); font-size: 13px; width: 72px; text-align: right; }
  .group { color: var(--dim); font-size: 12px; margin: 12px 0 2px; }
  .weak { display: flex; align-items: center; gap: 12px; }
  .weak > span { flex: 1; }
  .lane { display: block; padding: 4px 0; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 14px 18px; }
  .foot .spacer { flex: 1; }
  .dim { color: var(--dim); }
  #undoLabel { font-size: 12px; }
  .bar { height: 6px; background: var(--input); border-radius: 3px; margin: 10px 0 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Set Leveler</h1>
  <label class="target">Target <input id="target" type="number" step="0.5" value="-12"></label>
  <button id="analyze">Analyze</button>
</header>
<div id="main"></div>
<div class="foot">
  <button id="toggle" class="link" hidden>See every clip</button>
  <span class="spacer"></span>
  <span id="undoLabel" class="dim"></span>
  <button id="undo" disabled>Undo</button>
  <button id="apply" class="primary" disabled>Apply</button>
</div>

<script>
  const send = (action, extra) => window.max.outlet("ui", encodeURIComponent(JSON.stringify({ action, ...extra })));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const fmt = (v) => (v > 0 ? "+" : "") + v.toFixed(1) + " dB";
  const main = document.getElementById("main");
  let state = null;
  let showAll = false;
  let parts = [];

  function picker(s, c) {
    const tracks = s.rows.filter((r) => r.role.kind === "track" && r.key !== c.key);
    const v = c.role.kind === "layer" ? (c.role.host ? "host:" + c.role.host : "") : c.role.kind;
    const opt = (value, label) => `<option value="${esc(value)}"${v === value ? " selected" : ""}>${esc(label)}</option>`;
    return `<select data-clip="${esc(c.key)}">
      ${v === "" ? '<option value="" selected>Choose...</option>' : ""}
      ${opt("track", "Its own track")}${opt("leave", "Leave alone")}
      <optgroup label="Layered on">${tracks.map((t) => opt("host:" + t.key, t.name)).join("")}</optgroup>
    </select>`;
  }

  function change(c) {
    if (c.unread) return '<span class="dim">no reading</span>';
    if (c.changeDb === null) return '<span class="dim">none</span>';
    return fmt(c.changeDb) + (c.clamped ? " (limit)" : "");
  }

  function everyClip(s) {
    const row = (c) => `<div class="row"><div class="name">${esc(c.name)}</div>${picker(s, c)}<div class="chg">${change(c)}</div></div>`;
    const group = (title, list) => list.length ? `<div class="group">${title}</div>${list.map(row).join("")}` : "";
    return `<div class="block">
      ${group("Tracks", s.rows.filter((c) => c.role.kind === "track"))}
      ${group("Layers", s.rows.filter((c) => c.role.kind === "layer"))}
      ${group("Left alone", s.rows.filter((c) => c.role.kind === "leave"))}
    </div>`;
  }

  function render() {
    const s = state;
    if (!s) return;
    const busy = s.phase === "measuring" || s.phase === "busy";
    const ready = s.phase === "ready";
    document.getElementById("target").value = Math.round(s.target * 10) / 10;
    document.getElementById("analyze").disabled = busy;
    document.getElementById("apply").disabled = !ready;
    document.getElementById("undo").disabled = !s.canUndo || busy;
    document.getElementById("undoLabel").textContent = s.undoLabel;
    const toggle = document.getElementById("toggle");
    toggle.hidden = !ready;
    toggle.textContent = showAll ? "Hide clips" : "See every clip";

    const html = [];
    if (s.needsLanes) {
      html.push(`<div class="block"><h2>Which tracks hold layers?</h2>
        <div class="sub" style="margin-bottom:10px">Layers move with the track they're on. You can change any clip later.</div>
        ${s.candidates.map((c) => `<label class="lane"><input type="checkbox" value="${c.trackIndex}"> ${esc(c.trackName)}</label>`).join("")}
        <p><button id="lanesDone" class="primary">Continue</button></p></div>`);
    } else if (s.progress) {
      const p = s.progress;
      html.push(`<div class="block"><div class="summary">${esc(p.label)}...</div>
        <div class="bar"><div style="width:${p.total ? (100 * p.done) / p.total : 0}%"></div></div>
        <div class="sub">${p.done} of ${p.total} ${esc(p.unit)}</div></div>`);
    } else if (ready) {
      html.push(`<div class="block"><div class="summary">${esc(s.headline)}</div><div class="sub">${esc(s.detail)}</div></div>`);
      if (s.needAnswer.length) {
        const open = s.rows.filter((c) => s.needAnswer.includes(c.key));
        html.push(`<div class="block"><h2>${open.length} clip${open.length === 1 ? " needs" : "s need"} an answer</h2>
          ${open.map((c) => `<div class="q"><div class="name">${esc(c.name)}</div>${picker(s, c)}</div>`).join("")}
          <div class="sub" style="margin-top:10px">Anything unanswered stays as it is.</div></div>`);
      }
      if (s.weakest) {
        html.push(`<div class="block weak"><span>Weakest link: <b>${esc(s.weakest.name)}</b>. Matching it costs the set ${s.weakest.costDb.toFixed(1)} dB.</span><button id="match">Match it</button></div>`);
      }
      if (showAll) html.push(everyClip(s));
    } else if (!busy) {
      html.push(`<div class="block"><div class="sub">Press Analyze to measure this Set's Session clips. Nothing changes until you press Apply.</div></div>`);
    }
    if (s.message) html.push(`<div class="block"><div>${esc(s.message)}</div></div>`);
    main.innerHTML = html.join("");

    const done = document.getElementById("lanesDone");
    if (done) done.onclick = () => send("lanes", { tracks: [...main.querySelectorAll(".lane input:checked")].map((i) => Number(i.value)) });
    const match = document.getElementById("match");
    if (match) match.onclick = () => send("match");
  }

  main.addEventListener("change", (e) => {
    const key = e.target.dataset && e.target.dataset.clip;
    if (!key || !e.target.value) return;
    const v = e.target.value;
    const role = v.startsWith("host:") ? { kind: "layer", host: v.slice(5) } : { kind: v };
    send("role", { key, role });
  });
  document.getElementById("target").addEventListener("change", (e) => send("target", { target: Number(e.target.value) }));
  document.getElementById("analyze").onclick = () => send("analyze");
  document.getElementById("apply").onclick = () => send("apply");
  document.getElementById("undo").onclick = () => send("undo");
  document.getElementById("toggle").onclick = () => { showAll = !showAll; render(); };

  window.max.bindInlet("state_part", (index, total, chunk) => {
    if (index === 0) parts = [];
    parts[index] = chunk;
    if (index === total - 1) {
      state = JSON.parse(decodeURIComponent(parts.join("")));
      render();
    }
  });
  send("ready");
</script>
</body>
</html>
