name: ci

# Each tool under extensions/ and max-for-live/ has its own version and is released by its own tag:
# stem-export-v0.4.0 or set-leveler-v0.1.0. A new tool needs no change here. It needs a package.json with
# `test`, `build` and `package` scripts, and `package` must leave an .ablx or .zip in the tool's folder.
on:
  push:
    branches: [main]
    tags: ["*-v*"]
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          echo "dirs=$(ls -d extensions/*/package.json max-for-live/*/package.json | xargs -n1 dirname | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  test:
    needs: tools
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.tools.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds only the tool named in the tag, and attaches what it packages to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: tool
        run: echo "dir=$(.github/tool-for-tag.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: ${{ steps.tool.outputs.dir }}
      - run: npm run package
        working-directory: ${{ steps.tool.outputs.dir }}
      - name: Publish release
        working-directory: ${{ steps.tool.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" *.ablx *.zip --prerelease --title "$GITHUB_REF_NAME" --generate-notes
